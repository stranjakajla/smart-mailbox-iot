<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mailbox</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        .header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .event-item {
            border-left: 5px solid #4CAF50;
            background: #ffffff;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .event-item p {
            margin: 5px 0;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-success { background-color: #28a745; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; }
        .btn-secondary { background-color: #6c757d; }
    </style>
</head>
<body>

    <div class="header">Smart Mailbox</div>

    <div class="container">
        <!-- Notifikacija -->
        <div class="card p-3 mb-4">
            <h5 class="text-success fw-bold">🔔 Najnovija notifikacija:</h5>
            <p id="latest-notification" class="fw-bold">Učitavanje...</p>
        </div>

        <!-- Log događaja -->
        <div class="card p-3">
            <h4 class="text-success fw-bold">Log događaja</h4>
            <p class="fw-bold text-primary"> <span id="total-events">0</span></p>

            <!-- Dugmad za filtriranje -->
            <div class="btn-group">
                <button id="show-owner" class="btn btn-success">Vlasnik otvorio</button>
                <button id="show-postman" class="btn btn-warning">Pošta dostavljena</button>
                <button id="show-danger" class="btn btn-danger">Opasnost</button>
                <button id="show-all" class="btn btn-secondary">Prikaži sve</button>
            </div>

            <!-- Lista događaja -->
            <div id="event-list" class="mt-3">
                <p>Učitavanje podataka...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    
    <!-- Povezivanje JavaScript fajla -->
    <script src="smartmailbox.js"></script>

</body>
</html>
